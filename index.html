<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Rock Paper Scissors</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="game-container">

        <h1>Rock Paper Scissors</h1>

        <p>Choose your move</p>

        <div class="score-board">

            <div>
                <h3>You</h3>
                <span id="win-score">0</span>
            </div>

            <div>
                <h3>Computer</h3>
                <span id="lose-score">0</span>
            </div>

            <div>
                <h3>Tie</h3>
                <span id="tie-score">0</span>
            </div>

        </div>


        <div class="choices">

            <button class="choice-btn" onclick="playGame('rock')">
                🪨
                <span>Rock</span>
            </button>

            <button class="choice-btn" onclick="playGame('paper')">
                📄
                <span>Paper</span>
            </button>

            <button class="choice-btn" onclick="playGame('scissors')">
                ✂️
                <span>Scissors</span>
            </button>

        </div>


        <div class="result-box">

            <p>
                You chose:
                <strong id="player-choice">-</strong>
            </p>

            <p>
                Computer chose:
                <strong id="computer-choice">-</strong>
            </p>

            <h2 id="result">Make your move!</h2>

        </div>


        <button class="reset-btn" onclick="resetGame()">
            Reset Game
        </button>

    </div>


    <script src="script.js"></script>

</body>
</html>
